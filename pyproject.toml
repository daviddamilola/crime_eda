[project]
name = "latam-eda"
version = "0.1.0"
description = "Exploratory analysis of LATAM ACLED conflict events and the Mexican cartel rivalry network"
requires-python = ">=3.13"
dependencies = [
    "polars>=1.9",
    "numpy>=1.26",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "scipy>=1.13",
    "plotly>=5.24",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "networkx>=3.6.1",
    "kaleido>=1.3.0",
]

[tool.uv]
package = false
